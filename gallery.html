<!-- SLIDESHOW -->
<div id="carouselExampleIndicators"
class="carousel slide container my-5 shadow-lg"
data-bs-ride="carousel">

    <!-- INDICATORS -->
    <div class="carousel-indicators">
        <button type="button"
        data-bs-target="#carouselExampleIndicators"
        data-bs-slide-to="0"
        class="active"></button>

        <button type="button"
        data-bs-target="#carouselExampleIndicators"
        data-bs-slide-to="1"></button>

        <button type="button"
        data-bs-target="#carouselExampleIndicators"
        data-bs-slide-to="2"></button>
    </div>

    <!-- SLIDES -->
    <div class="carousel-inner rounded">

        <!-- SLIDE 1 -->
        <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6"
            class="d-block w-100 carousel-img"
            alt="Nature">

            <div class="carousel-caption">
                <h3>Protecting Nature</h3>
                <p>Creating a greener future for communities</p>
            </div>
        </div>

        <!-- SLIDE 2 -->
        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1528323273322-d81458248d40"
            class="d-block w-100 carousel-img"
            alt="Community Cleanup">

            <div class="carousel-caption">
                <h3>Community Cleanups</h3>
                <p>Working together to keep cities clean</p>
            </div>
        </div>

        <!-- SLIDE 3 -->
        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952"
            class="d-block w-100 carousel-img"
            alt="Waste Collection">

            <div class="carousel-caption">
                <h3>Waste Collection</h3>
                <p>Reliable and sustainable waste management</p>
            </div>
        </div>

    </div>

    <!-- CONTROLS -->
    <button class="carousel-control-prev"
    type="button"
    data-bs-target="#carouselExampleIndicators"
    data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <button class="carousel-control-next"
    type="button"
    data-bs-target="#carouselExampleIndicators"
    data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>
