<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | GreenCycle Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container mt-5">
    <h2>Service Feedback</h2>
    <p>Please let us know how we can improve our waste collection services.</p>
    
    <form action="#" method="POST" class="row g-3">
        <div class="col-md-6">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <div class="col-md-6">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="col-12">
            <label for="service" class="form-label">Service Type</label>
            <select id="service" class="form-select" required>
                <option value="">Choose...</option>
                <option>Residential Collection</option>
                <option>Commercial Recycling</option>
                <option>Hazardous Waste</option>
            </select>
        </div>
        <div class="col-12">
            <label for="comments" class="form-label">Comments</label>
            <textarea class="form-control" id="comments" rows="4" required></textarea>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-success">Submit Feedback</button>
        </div>
    </form>
</main>

<footer class="text-center mt-5">
    <p>&copy; 2026 GreenCycle Solutions. All Rights Reserved.</p>
</footer>

</body>
</html>
