<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact - GreenCycle</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container my-5">
    <h2 class="text-center mb-4">Contact Us</h2>

    <form id="contactForm">

        <input type="text" id="name" class="form-control mb-3" placeholder="Your Name">
        <small id="nameError" class="text-danger"></small>

        <input type="email" id="email" class="form-control mb-3" placeholder="Your Email">
        <small id="emailError" class="text-danger"></small>

        <textarea id="message" class="form-control mb-3" placeholder="Your Message"></textarea>
        <small id="messageError" class="text-danger"></small>

        <button class="btn btn-success">Send Message</button>

    </form>
</div>

<script src="script.js"></script>

</body>
</html>
